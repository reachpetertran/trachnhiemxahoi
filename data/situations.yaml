# Trục 2 – "Tôi đang gặp chuyện gì"
situations:
- q: Công ty không ký hợp đồng, không đưa tôi bản hợp đồng
  to: hop-dong-lao-dong
  q_en: The company has no contract with me, or never gave me my copy
- q: Công ty giữ CCCD, bằng cấp gốc hoặc bắt đặt cọc
  to: hop-dong-lao-dong
  q_en: The company keeps my ID card or original diplomas, or asked for a deposit
- q: Thử việc quá lâu, lương thử việc quá thấp
  to: hop-dong-lao-dong
  q_en: Probation is too long, or probation pay is too low
- q: Tôi muốn nghỉ việc – có phải báo trước không?
  to: hop-dong-lao-dong
  q_en: I want to quit – do I have to give notice?
- q: Bị nợ lương, trả lương trễ, phiếu lương không rõ
  to: tien-luong-lam-them-gio
  q_en: Unpaid wages, late pay, unclear payslips
- q: Bị ép tăng ca, tiền tăng ca tính sai
  to: tien-luong-lam-them-gio
  q_en: Forced overtime, or overtime paid wrongly
- q: Nghỉ việc rồi mà chưa được trả lương, tiền phép
  to: tien-luong-lam-them-gio
  q_en: I have left but have not been paid wages or untaken leave
- q: Công ty không đóng hoặc đóng thiếu bảo hiểm xã hội
  to: bao-hiem-xa-hoi
  q_en: The company does not pay, or underpays, my social insurance
- q: Mất việc – tôi có được trợ cấp thất nghiệp không?
  to: bao-hiem-xa-hoi
  q_en: I lost my job – can I get unemployment benefit?
- q: Làm liền nhiều tuần không có ngày nghỉ, bị trừ phép năm sai
  q_en: Weeks without a day off, or annual leave deducted wrongly
  to: gio-lam-viec-nghi-ngoi
- q: Nghỉ việc, bị cắt giảm – tôi có được trợ cấp thôi việc, mất việc không?
  q_en: I left or was laid off – do I get severance or a job-loss allowance?
  to: tro-cap-thoi-viec-mat-viec
- q: Không còn hợp đồng lao động – có tự đóng BHXH được không?
  q_en: I no longer have a contract – can I pay social insurance myself?
  to: bhxh-tu-nguyen
- q: Đi làm xa quê, khám bệnh bằng BHYT ở đâu, được trả bao nhiêu?
  q_en: I work far from home – where can I use health insurance, and how much is paid?
  to: bao-hiem-y-te
- q: Nơi làm việc nguy hiểm, bụi, ồn, hóa chất
  to: an-toan-ve-sinh-lao-dong
  q_en: 'My workplace is dangerous: dust, noise, chemicals'
- q: Không được khám sức khỏe, khám bệnh nghề nghiệp
  to: an-toan-ve-sinh-lao-dong
  q_en: No health checks or occupational disease screening
- q: Tôi bị tai nạn lao động – công ty phải trả gì?
  q_en: I had a work accident – what must the employer pay?
  to: tai-nan-lao-dong
- q: Tôi làm ở nhà máy nhưng ký hợp đồng với công ty dịch vụ (thuê ngoài, thuê lại)
  q_en: I work in a factory but my contract is with an agency (outsourced, leased)
  to: lao-dong-thue-lai
- q: Tôi làm việc với hóa chất – đọc nhãn, phiếu an toàn thế nào?
  q_en: I work with chemicals – how do I read the label and safety data sheet?
  to: hoa-chat
- q: Tôi có thai / đang nuôi con nhỏ – công ty vẫn bắt làm đêm, tăng ca
  q_en: I am pregnant or have a baby – the company still makes me work nights or overtime
  to: lao-dong-nu
- q: Bị đụng chạm, trêu ghẹo, nhắn tin gợi dục ở chỗ làm
  q_en: I am touched, teased or sent sexual messages at work
  to: phan-biet-doi-xu-quay-roi
- q: Bị đối xử khác vì giới tính, tuổi, có thai, dân tộc
  q_en: I am treated differently because of my sex, age, pregnancy or ethnicity
  to: phan-biet-doi-xu-quay-roi
- q: Sắp đi làm ở nước ngoài – sợ bị lừa, bị thu phí cao
  to: di-lam-viec-o-nuoc-ngoai
  q_en: Going to work abroad – afraid of scams and high fees
- q: Đang ở nước ngoài, bị giữ hộ chiếu, bị ép làm việc
  to: di-lam-viec-o-nuoc-ngoai
  q_en: 'Abroad: my passport is held and I am forced to work'
- q: Sắp đi nước ngoài – cần ký gì, nộp gì, giữ giấy tờ gì?
  q_en: Going abroad soon – what do I sign, pay and keep?
  to: truoc-khi-di-nuoc-ngoai
- q: Đã về nước – làm sao nhận lại tiền ký quỹ, thanh lý hợp đồng?
  q_en: Back home – how do I get my deposit back and settle my contract?
  to: ve-nuoc
- q: Công ty phạt tiền, trừ lương, ép mua hàng của công ty
  q_en: The company fines me, deducts from my pay, or makes me buy its goods
  to: quan-ly-tien-luong
- q: Lương không đủ tiêu đến cuối tháng
  q_en: My pay does not last until the end of the month
  to: quan-ly-tien-luong
- q: Vay tiền qua app, bị đòi nợ, người thân bị gọi điện đe dọa
  q_en: I borrowed through an app and am being threatened, or my relatives are getting threatening calls
  to: vay-qua-ung-dung-tin-dung-den
- q: Tôi muốn khiếu nại – cần chuẩn bị gì?
  to: giu-bang-chung
  q_en: I want to complain – what do I need to prepare?
- q: Tôi cần luật sư miễn phí
  to: danh-ba
  q_en: I need a free lawyer
