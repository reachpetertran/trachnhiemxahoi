# Khung chương trình – lộ trình học theo phần.
# Mỗi bài: slug = slug bài tiếng Việt đã đăng (tự lấy tiêu đề, tự nối bản tiếng Anh),
#          hoặc t/t_en = bài dự kiến (hiện nhãn "Sắp có", không có link).
# Bài nhạy cảm chính trị và nhóm nhạy cảm cao KHÔNG đưa vào đây khi Peter chưa duyệt.
intro: >-
  Học theo thứ tự từ Phần 1. Mỗi phần có mục tiêu: học xong, bạn làm được những việc ghi ở đó.
  Bài có đường dẫn là bài đã đăng; bài “Sắp có” đang được biên soạn.
intro_en: >-
  Work through the parts in order, starting with Part 1. Each part has goals: when you finish it, you should be able to do the things listed.
  Lessons with a link are published; “Coming soon” lessons are being written.
modules:
- title: "Phần 1. Hợp đồng và tiền lương"
  title_en: "Part 1. Contracts and pay"
  goals:
    - Kiểm tra được hợp đồng của mình có đủ nội dung, đúng loại hợp đồng.
    - Tự tính được tiền tăng ca và so với phiếu lương.
    - Biết mình có phải là lao động thuê lại không, và công việc của mình có được phép thuê lại không.
    - Biết mình được nghỉ bao nhiêu ngày, và tự tính trợ cấp khi nghỉ việc.
  goals_en:
    - Check that your contract has the required content and is the right type.
    - Calculate your own overtime pay and compare it with your payslip.
    - Tell whether you are a leased worker, and whether your job may legally be leased.
    - Know how much time off you are entitled to, and work out your allowance when you leave.
  lessons:
    - slug: hop-dong-lao-dong
    - slug: tien-luong-lam-them-gio
    - slug: lao-dong-thue-lai
    - slug: gio-lam-viec-nghi-ngoi
    - slug: tro-cap-thoi-viec-mat-viec
- title: "Phần 2. Bảo hiểm"
  title_en: "Part 2. Insurance"
  goals:
    - Tự kiểm tra quá trình đóng BHXH trên ứng dụng VssID.
    - Biết khi nào được hưởng trợ cấp thất nghiệp và hạn nộp hồ sơ.
    - Biết cách tự đóng BHXH tự nguyện khi không còn hợp đồng lao động.
    - Dùng thẻ BHYT đúng cách để được quỹ trả nhiều nhất.
  goals_en:
    - Check your own social insurance record on the VssID app.
    - Know when you qualify for unemployment benefit and the filing deadline.
    - Know how to pay voluntary social insurance yourself when you no longer have a contract.
    - Use your health insurance card so the fund pays as much as possible.
  lessons:
    - slug: bao-hiem-xa-hoi
    - slug: bhxh-tu-nguyen
    - slug: bao-hiem-y-te
- title: "Phần 3. An toàn và sức khỏe khi làm việc"
  title_en: "Part 3. Safety and health at work"
  goals:
    - Nhận ra mối nguy ở chỗ làm và biết công ty phải làm gì.
    - Biết các bước khi bị tai nạn lao động và quyền lợi được hưởng.
    - Đọc được nhãn và phiếu an toàn của hóa chất mình đang dùng.
    - Biết quyền của lao động nữ khi mang thai, nuôi con nhỏ.
  goals_en:
    - Spot hazards at your workplace and know what the employer must do.
    - Know the steps after a work accident and what you are entitled to.
    - Read the label and safety data sheet of the chemicals you use.
    - Know women workers' rights during pregnancy and while raising a young child.
  lessons:
    - slug: an-toan-ve-sinh-lao-dong
    - slug: tai-nan-lao-dong
    - slug: hoa-chat
    - slug: lao-dong-nu
- title: "Phần 4. Bảo vệ quyền lợi của mình"
  title_en: "Part 4. Standing up for your rights"
  goals:
    - Tự lập bộ bằng chứng khi có tranh chấp.
    - Biết gửi khiếu nại tới đâu và xin trợ giúp pháp lý miễn phí.
    - Nhận ra phân biệt đối xử, quấy rối tình dục và biết cách báo.
  goals_en:
    - Build your own evidence file when there is a dispute.
    - Know where to file a complaint and how to get free legal aid.
    - Recognise discrimination and sexual harassment, and know how to report them.
  lessons:
    - slug: giu-bang-chung
    - slug: phan-biet-doi-xu-quay-roi
- title: "Phần 5. Đi làm việc ở nước ngoài"
  title_en: "Part 5. Working abroad"
  goals:
    - Nhận biết dấu hiệu lừa đảo và lao động cưỡng bức trước khi đi.
    - Biết gọi ai khi gặp khó khăn ở nước ngoài.
    - Chuẩn bị đủ giấy tờ trước khi đi; thanh lý hợp đồng, nhận lại ký quỹ khi về.
  goals_en:
    - Recognise signs of fraud and forced labour before you leave.
    - Know who to call if you run into trouble abroad.
    - Prepare your documents before leaving; settle your contract and get your deposit back on return.
  lessons:
    - slug: di-lam-viec-o-nuoc-ngoai
    - slug: truoc-khi-di-nuoc-ngoai
    - slug: ve-nuoc
- title: "Phần 6. Kỹ năng sống"
  title_en: "Part 6. Life skills"
  goals:
    - Lập được kế hoạch chi tiêu hằng tháng từ tiền lương.
    - Nhận ra bẫy vay qua ứng dụng và tín dụng đen.
  goals_en:
    - Make a monthly spending plan from your wages.
    - Recognise the traps of app loans and loan sharks.
  lessons:
    - slug: quan-ly-tien-luong
    - slug: vay-qua-ung-dung-tin-dung-den
